name: Bug report
description: Report a reproducible GrayMatter Lite defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, tenant identifiers, or private memory.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of commands or UI actions.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Redacted ./vaix doctor output
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS/Linux, CPU architecture, Java, Node, Docker if relevant
    validations:
      required: true
