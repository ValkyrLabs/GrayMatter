name: GrayMatter CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shell-and-mcp:
    name: Shell Suite And MCP Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y jq zip unzip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify test scripts are directly executable
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -name '*.sh' -type f -print | sort | while IFS= read -r test_script; do
            test -x "$test_script"
          done

      - name: Run direct shell test sweep
        run: |
          set -euo pipefail
          for test_script in tests/*.sh; do
            "$test_script"
          done

      - name: Run MCP server tests
        run: |
          set -euo pipefail
          npm test --prefix mcp-server

  windows-auth-and-install:
    name: Windows Auth And Install Surfaces
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate portable JavaScript
        shell: pwsh
        run: |
          node --check scripts/gm-auth.mjs
          node --check scripts/gm-mcp-launcher.mjs
          node --check mcp-server/index.js

      - name: Verify Windows Credential Manager round trip
        shell: pwsh
        run: |
          $thor_target = "GrayMatter:CI:$([guid]::NewGuid())"
          try {
            'ci-session' | & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\gm-windows-credential.ps1 -Action Write -Target $thor_target -UserName ci
            $thor_value = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\gm-windows-credential.ps1 -Action Read -Target $thor_target
            if ($thor_value -ne 'ci-session') { throw 'Credential Manager round trip failed.' }
          } finally {
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\gm-windows-credential.ps1 -Action Delete -Target $thor_target
          }

      - name: Verify Windows bootstrap and activation scripts parse
        shell: pwsh
        run: |
          $thor_allErrors = @()
          foreach ($thor_file in @('.\install.ps1', '.\graymatter-bootstrap.ps1', '.\scripts\gm-activate.ps1', '.\scripts\gm-windows-credential.ps1')) {
            $thor_tokens = $null
            $thor_errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $thor_file), [ref]$thor_tokens, [ref]$thor_errors) | Out-Null
            $thor_allErrors += $thor_errors
          }
          if ($thor_allErrors.Count -gt 0) { throw ($thor_allErrors | Out-String) }
