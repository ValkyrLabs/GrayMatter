name: Publish GrayMatter MCP Registry Metadata

# Manual publication of the approved immutable 0.3.3 metadata only.
# OIDC credentials exist only on the ephemeral GitHub Actions runner.
on:
  workflow_dispatch:

concurrency:
  group: graymatter-mcp-registry-publication
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.repository == 'ValkyrLabs/GrayMatter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate listing contracts
        run: node --test tests/mcp-registry.test.mjs

      - name: Download checksum-pinned official publisher
        run: |
          set -euo pipefail
          umask 077
          publisher_dir="$RUNNER_TEMP/graymatter-mcp-publisher"
          mkdir -p "$publisher_dir"
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$publisher_dir/publisher.tar.gz"
          printf '%s  %s\n' \
            a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc \
            "$publisher_dir/publisher.tar.gz" | sha256sum --check
          tar -xzf "$publisher_dir/publisher.tar.gz" -C "$publisher_dir" mcp-publisher

      - name: Publish exact metadata with ephemeral GitHub Actions identity
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected_sha = "cbeb1627551d28e5ae1fb9b66d565d6136f96bf89efb751d03c299c77cb32403"
          metadata = Path("server.json")
          assert hashlib.sha256(metadata.read_bytes()).hexdigest() == expected_sha
          expected = json.loads(metadata.read_text())
          assert expected["name"] == "io.github.ValkyrLabs/graymatter"
          assert expected["version"] == "0.3.3"
          registry = "https://registry.modelcontextprotocol.io"
          encoded_name = urllib.parse.quote(expected["name"], safe="")
          record_url = registry + "/v0.1/servers/" + encoded_name + "/versions/0.3.3"
          publisher = Path(os.environ["RUNNER_TEMP"]) / "graymatter-mcp-publisher/mcp-publisher"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          def read_json(url):
              try:
                  response = urllib.request.build_opener(NoRedirect()).open(
                      urllib.request.Request(url, headers={"Accept": "application/json"}), timeout=30
                  )
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  payload = response.read(2 * 1024 * 1024 + 1)
                  if len(payload) > 2 * 1024 * 1024:
                      raise RuntimeError("Public verification response exceeds its bound")
                  return response.status, json.loads(payload) if payload else {}

          def verify_record(record):
              data = record.get("server", record)
              actual = {key: data.get(key) for key in expected}
              if actual != expected:
                  raise RuntimeError("Immutable registry version differs from approved metadata")

          def run_publisher(*arguments):
              result = subprocess.run(
                  [str(publisher), *arguments], capture_output=True, text=True, timeout=120
              )
              text = result.stdout + result.stderr
              text = re.sub(r"gh[pousr]_[A-Za-z0-9_]+", "[credential redacted]", text)
              text = re.sub(
                  r"eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+",
                  "[credential redacted]", text
              )
              print(text, end="")
              if result.returncode:
                  raise RuntimeError("Official publisher failed; reconcile the exact record before retrying")

          run_publisher("validate", str(metadata))
          status, existing = read_json(record_url)
          if status == 200:
              verify_record(existing)
              print("Matching immutable version already exists; skipping identity and publication.")
          elif status == 404:
              run_publisher("login", "github-oidc", "--registry", registry)
              run_publisher("publish", str(metadata))
              status, published = read_json(record_url)
              if status != 200:
                  raise RuntimeError("Publication is not verified; do not automatically retry")
              verify_record(published)
          else:
              raise RuntimeError("Registry preflight failed; no authentication or publication attempted")

          print("Verified official registry record:", record_url)
          query = urllib.parse.urlencode({
              "search": expected["name"], "version": "latest", "limit": 100
          })
          gallery_url = "https://api.mcp.github.com/v0.1/servers?" + query
          gallery_status, gallery = read_json(gallery_url)
          matches = [
              row.get("server", row) for row in gallery.get("servers", [])
              if row.get("server", row).get("name") == expected["name"]
              and row.get("server", row).get("version") == expected["version"]
          ]
          observed = gallery_status == 200 and bool(matches)
          print("GitHub MCP gallery version observed:", observed)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("Official MCP Registry version 0.3.3 verified: " + record_url + "\n")
              summary.write("GitHub MCP gallery version observed: " + str(observed) + "\n")
          PY

      - name: Remove runner-local publisher token
        if: always()
        run: rm -f -- "$HOME/.config/mcp-publisher/token.json"
