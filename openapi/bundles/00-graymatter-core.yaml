---
openapi: 3.0.3
info:
  title: GrayMatter Lite API
  version: 0.4.0
  description: Canonical ThorAPI source for the local GrayMatter domain. Generated
    audit, ownership, CRUD, repository, service, controller, and client surfaces are
    derived from this document; generated source is never edited directly.
  contact:
    email: info@valkyrlabs.com
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
- url: "/v1"
  description: GrayMatter Lite local server
tags:
- name: GrayMatter
  description: GrayMatter aggregate and memory operations
- name: MemoryEntry
  description: Durable local memory records
- name: MemoryRetentionPolicy
  description: Local memory retention policy
- name: UserPreference
  description: Local user preferences
- name: Workbook
  description: GridHeim-compatible local workbooks
- name: KnowledgePack
  description: Portable signed GrayMatter knowledge packs
- name: MemoryAssociationOperations
  description: Authorized durable associations between memory identities
- name: LocalRuntimeOperations
  description: Handwritten local-runtime adapters around generated domain services
security:
- basicAuth: []
paths:
  "/graymatter/memory/associations/capabilities":
    get:
      tags: [MemoryAssociationOperations]
      operationId: getMemoryAssociationCapabilities
      x-thorapi-nonCrud: true
      summary: Inspect authenticated durable memory association support
      responses:
        '200':
          description: Exact association protocol and verified physical deletion policy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryAssociationCapability"
        '401': {description: Authentication required}
        '503': {description: Association storage or required constraints unavailable}
  "/graymatter/memory/associations":
    post:
      tags: [MemoryAssociationOperations]
      operationId: recordMemoryAssociation
      x-thorapi-nonCrud: true
      summary: Record one authorized directed memory identity association
      description: >-
        Accepts exactly fromId, toId and relation. The server derives identity,
        placement, audit fields and the idempotent write key. Both current memory
        identities must remain authorized. Labels are navigation metadata and do
        not create supersession, contradiction, corroboration or other evidence.
        A current exact tuple reuses its original committed association receipt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MemoryAssociationRequest"
      responses:
        '201':
          description: New association committed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryAssociationReceipt"
        '200':
          description: Existing exact association reauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryAssociationReceipt"
        '400': {description: Invalid tuple or unsupported request field}
        '401': {description: Authentication required}
        '403': {description: Association write is not authorized}
        '404': {description: Required authorized memory unavailable}
        '409': {description: Stored association no longer matches its admitted identity}
        '503': {description: Association storage or required constraints unavailable}
  "/graymatter/memory/associations/{associationRef}":
    get:
      tags: [MemoryAssociationOperations]
      operationId: readMemoryAssociation
      x-thorapi-nonCrud: true
      summary: Reauthorize and read an exact persisted association receipt
      parameters:
      - name: associationRef
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Association and both current memory identities remain authorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryAssociationReceipt"
        '401': {description: Authentication required}
        '404': {description: Required authorized association or memory unavailable}
        '409': {description: Stored association integrity is invalid}
        '503': {description: Association storage or required constraints unavailable}
  "/api-docs":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getOpenApiSchema
      x-thorapi-nonCrud: true
      summary: Return the generated OpenAPI document
      responses:
        '200':
          description: Generated OpenAPI document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  "/MemoryEntry/write":
    post:
      tags:
      - LocalRuntimeOperations
      operationId: writeMemoryEntry
      x-thorapi-nonCrud: true
      summary: Write a durable memory through the local compatibility contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateMemoryEntryRequest"
      responses:
        '200':
          description: Persisted memory
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryEntry"
  "/graymatter/memory/{id}":
    get:
      tags: [LocalRuntimeOperations]
      operationId: getLiteMemorySnapshot
      x-thorapi-nonCrud: true
      summary: Read the current owned memory revision
      parameters:
      - "$ref": "#/components/parameters/id"
      responses:
        '200':
          description: Read the current owned memory revision
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteMemoryEntrySnapshot"
        '404':
          description: Requested object is unavailable to the current principal
  "/graymatter/memory/{id}/revise":
    post:
      tags: [LocalRuntimeOperations]
      operationId: reviseLiteMemory
      x-thorapi-nonCrud: true
      summary: Correct the exact owned revision
      parameters:
      - "$ref": "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LiteMemoryRevisionRequest"
      responses:
        '200':
          description: Correct the exact owned revision
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteMemoryEntrySnapshot"
        '400':
          description: Invalid request or revision hash
        '404':
          description: Requested object is unavailable to the current principal
        '409':
          description: Individual edits to signed knowledge pack contents are unavailable
        '412':
          description: The reviewed memory revision has changed
  "/graymatter/memory/{id}/forget":
    post:
      tags: [LocalRuntimeOperations]
      operationId: forgetLiteMemory
      x-thorapi-nonCrud: true
      summary: Forget the confirmed owned revision
      parameters:
      - "$ref": "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LiteMemoryForgetRequest"
      responses:
        '204':
          description: Owned memory was removed
        '400':
          description: Invalid request or revision hash
        '404':
          description: Requested object is unavailable to the current principal
        '409':
          description: Individual edits to signed knowledge pack contents are unavailable
        '412':
          description: The reviewed memory revision has changed
  "/graymatter/retrieval-context/{id}/refresh":
    post:
      tags: [LocalRuntimeOperations]
      operationId: refreshLiteContext
      x-thorapi-nonCrud: true
      summary: Rerun the original discovery against current eligible memories
      parameters:
      - "$ref": "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LiteDiscoveryRequest"
      responses:
        '200':
          description: Rerun the original discovery against current eligible memories
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteContextResponse"
        '400':
          description: Unsupported inputs or a required protected source is unavailable
        '404':
          description: Requested object is unavailable to the current principal
        '409':
          description: Original discovery scope unavailable or different
  "/MemoryEntry/read":
    post:
      tags:
      - LocalRuntimeOperations
      operationId: readMemoryEntries
      x-thorapi-nonCrud: true
      summary: Read memories through the compatibility query envelope
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/QueryMemoryEntryRequest"
      responses:
        '200':
          description: Matching memories
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/MemoryEntry"
  "/MemoryEntry/query":
    post:
      tags:
      - LocalRuntimeOperations
      operationId: queryMemoryEntries
      x-thorapi-nonCrud: true
      summary: Query owner-visible memories
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/QueryMemoryEntryRequest"
      responses:
        '200':
          description: Query result envelope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryQueryResponse"
  "/memory/status":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getMemoryStatus
      x-thorapi-nonCrud: true
      summary: Report local memory readiness and metrics
      responses:
        '200':
          description: Memory readiness
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryStatusResponse"
  "/memory/usage":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getMemoryUsage
      x-thorapi-nonCrud: true
      summary: Report local memory usage
      responses:
        '200':
          description: Memory usage
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemoryUsageResponse"
  "/graymatter/stats":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getGrayMatterStats
      x-thorapi-nonCrud: true
      summary: Report the GrayMatter Lite aggregate state
      responses:
        '200':
          description: Aggregate state
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GrayMatterStatsResponse"
  "/graymatter/activation/bridge":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getActivationBridge
      x-thorapi-nonCrud: true
      summary: Inspect the hosted promotion bridge
      responses:
        '200':
          description: Bridge state
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GrayMatterActivationBridgeResponse"
  "/graymatter/activation/bridge/event":
    post:
      tags:
      - LocalRuntimeOperations
      operationId: recordActivationBridgeEvent
      x-thorapi-nonCrud: true
      summary: Record a bounded local promotion event
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GrayMatterActivationEventRequest"
      responses:
        '200':
          description: Recorded event
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GrayMatterActivationEventResponse"
  "/swarm-ops/graph":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getSwarmGraph
      x-thorapi-nonCrud: true
      summary: Return the local SWARM graph projection
      responses:
        '200':
          description: Local graph projection
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SwarmGraphSnapshot"
  "/knowledge-packs":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: listKnowledgePacks
      x-thorapi-nonCrud: true
      summary: List imported owner-visible KnowledgePacks
      responses:
        '200':
          description: Imported KnowledgePacks
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/KnowledgePackSummary"
  "/knowledge-packs/import":
    post:
      tags:
      - LocalRuntimeOperations
      operationId: importKnowledgePack
      x-thorapi-nonCrud: true
      summary: Import a signed KnowledgePack
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgePackImportResult"
  "/knowledge-packs/export":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: exportKnowledgePack
      x-thorapi-nonCrud: true
      summary: Export owner-visible memory as a KnowledgePack
      responses:
        '200':
          description: Signed KnowledgePack archive
          content:
            application/vnd.valkyrlabs.graymatter-knowledge-pack+zip:
              schema:
                type: string
                format: binary
  "/knowledge-packs/{id}":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getImportedKnowledgePack
      x-thorapi-nonCrud: true
      parameters:
      - "$ref": "#/components/parameters/id"
      responses:
        '200':
          description: KnowledgePack summary
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgePackSummary"
  "/knowledge-packs/{id}/graph":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: getKnowledgePackGraph
      x-thorapi-nonCrud: true
      parameters:
      - "$ref": "#/components/parameters/id"
      responses:
        '200':
          description: KnowledgePack object graph
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KnowledgePackGraphResponse"
  "/knowledge-packs/{id}/archive":
    get:
      tags:
      - LocalRuntimeOperations
      operationId: downloadKnowledgePackArchive
      x-thorapi-nonCrud: true
      parameters:
      - "$ref": "#/components/parameters/id"
      responses:
        '200':
          description: Original imported archive
          content:
            application/vnd.valkyrlabs.graymatter-knowledge-pack+zip:
              schema:
                type: string
                format: binary
  "/graymatter/retrieval-context/{id}/fork":
    post:
      summary: Fork a receipt-backed context with fresh owner and source-hash checks
      tags:
      - LocalRuntimeOperations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                tokenBudget:
                  type: integer
                  minimum: 128
                  maximum: 16000
              required:
              - query
      responses:
        '200':
          description: Child context reference and receipt
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteContextResponse"
      operationId: graymatterLiteGraymatterRetrievalContextIdForkPost
      x-thorapi-nonCrud: true
  "/memory/semantic-health":
    get:
      summary: Inspect local vector index profiles without contacting a model
      tags:
      - LocalRuntimeOperations
      responses:
        '200':
          description: Portable and optional semantic vector counts
      operationId: graymatterLiteMemorySemanticHealthGet
      x-thorapi-nonCrud: true
  "/memory/capabilities":
    get:
      summary: Discover GrayMatter Lite local vector and hybrid retrieval
      tags:
      - LocalRuntimeOperations
      responses:
        '200':
          description: Portable index capability metadata
      operationId: graymatterLiteMemoryCapabilitiesGet
      x-thorapi-nonCrud: true
  "/memory/semantic-index/search":
    post:
      summary: Search owned memories with keyword, vector, or hybrid ranking
      tags:
      - LocalRuntimeOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                retrievalMode:
                  type: string
                  enum:
                  - KEYWORD
                  - VECTOR
                  - HYBRID
                  - SCHEMA_FILTERED
                  - RECENCY_BIASED
                type:
                  type: string
                source:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                filters:
                  type: object
                  description: Lite accepts only type, source/sourceChannel, and tags;
                    other keys are rejected
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                    source:
                      type: string
                    sourceChannel:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
              required:
              - query
      responses:
        '200':
          description: Owner-scoped ranked memory hits with lexical/vector scores
            and index profile
      operationId: graymatterLiteMemorySemanticIndexSearchPost
      x-thorapi-nonCrud: true
  "/memory/reindex":
    post:
      summary: Rebuild the authenticated principal memory vector projection
      tags:
      - LocalRuntimeOperations
      responses:
        '200':
          description: Indexed, semantic-indexed, and stale-row counts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dryRun:
                  type: boolean
      operationId: graymatterLiteMemoryReindexPost
      x-thorapi-nonCrud: true
  "/memory/semantic-index/reindex":
    post:
      summary: Alias for local memory reindex
      tags:
      - LocalRuntimeOperations
      responses:
        '200':
          description: Indexed, semantic-indexed, and stale-row counts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                dryRun:
                  type: boolean
      operationId: graymatterLiteMemorySemanticIndexReindexPost
      x-thorapi-nonCrud: true
  "/graymatter/retrieval-context":
    post:
      summary: Compile bounded Bifrost context from owned memory
      tags:
      - LocalRuntimeOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                topK:
                  type: integer
                  minimum: 1
                  maximum: 100
                tokenBudget:
                  type: integer
                  minimum: 128
                  maximum: 16000
                includeAssociations:
                  type: boolean
                  default: false
                  description: Expand one hop from independently relevant memory anchors.
                retrievalMode:
                  type: string
                  enum:
                  - KEYWORD
                  - VECTOR
                  - HYBRID
                  - SCHEMA_FILTERED
                  - RECENCY_BIASED
                protectedRefs:
                  type: array
                  items:
                    type: string
                    format: uuid
                filters:
                  type: object
                  description: Lite accepts only type, source/sourceChannel, and tags;
                    other keys are rejected
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                    source:
                      type: string
                    sourceChannel:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
              required:
              - query
      responses:
        '200':
          description: Bounded context, citations, and content-free receipt reference
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteContextResponse"
      operationId: graymatterLiteGraymatterRetrievalContextPost
      x-thorapi-nonCrud: true
  "/graymatter-retrieval-receipts":
    post:
      summary: Retrieve memory with durable Bifrost receipt
      tags:
      - LocalRuntimeOperations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                topK:
                  type: integer
                includeAssociations:
                  type: boolean
                  default: false
                  description: Expand one hop from independently relevant memory anchors.
                retrievalMode:
                  type: string
                includeText:
                  type: boolean
                filters:
                  type: object
                  description: Lite accepts only type, source/sourceChannel, and tags;
                    other keys are rejected
                  additionalProperties: false
                  properties:
                    type:
                      type: string
                    source:
                      type: string
                    sourceChannel:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
              required:
              - query
      responses:
        '200':
          description: Receipt with policy-gated retrieval context
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteContextResponse"
      operationId: graymatterLiteGraymatterRetrievalReceiptsPost
      x-thorapi-nonCrud: true
  "/graymatter-retrieval-receipts/{id}":
    get:
      summary: Inspect an owned content-free retrieval receipt and source freshness
      tags:
      - LocalRuntimeOperations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Receipt status and stale refs
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteReceiptStatus"
        '404':
          description: Receipt not owned or missing
      operationId: graymatterLiteGraymatterRetrievalReceiptsIdGet
      x-thorapi-nonCrud: true
  "/graymatter/retrieval-context/{id}/recompress":
    post:
      summary: Recompress a receipt after rechecking every source
      tags:
      - LocalRuntimeOperations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                tokenBudget:
                  type: integer
                  minimum: 128
                  maximum: 16000
                protectedRefs:
                  type: array
                  items:
                    type: string
                    format: uuid
                evictedRefs:
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - query
      responses:
        '200':
          description: Child receipt and rechecked context
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteContextResponse"
        '409':
          description: Query or protected source changed
      operationId: graymatterLiteGraymatterRetrievalContextIdRecompressPost
      x-thorapi-nonCrud: true
  "/graymatter/retrieval-context/{id}/hydrate/{memoryId}":
    get:
      summary: Hydrate one exact receipt source after current owner and hash checks
      tags:
      - LocalRuntimeOperations
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: maxTokens
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 4000
      responses:
        '200':
          description: Bounded redacted source excerpt
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LiteHydrationResponse"
        '404':
          description: Receipt or memory not owned or missing
        '409':
          description: Current receipt cannot authorize hydration of a source
      operationId: graymatterLiteGraymatterRetrievalContextIdHydrateMemoryidGet
      x-thorapi-nonCrud: true
components:
  schemas:
    Principal:
      type: object
      x-thorapi-table-name: graymatter_principal
      description: Generated domain principal used by ThorAPI ownership and ACL contracts.
      required:
      - username
      - password
      - email
      properties:
        username:
          type: string
          minLength: 5
          maxLength: 60
          x-thorapi-dataField: unique=true, index=true
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 64
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)[\\x21-\\x7E]{8,64}$"
          x-field-extra-annotation: "@SecureField(encryptionType = SecureField.EncryptionType.HASHED,
            strength = 10)"
        email:
          type: string
          format: email
          maxLength: 320
          x-thorapi-dataField: unique=true, index=true
        enabled:
          type: boolean
          default: true
        credentialNonExpired:
          type: boolean
          default: true
        accountEnabled:
          type: boolean
          default: true
        accountNonLocked:
          type: boolean
          default: true
        accountNonExpired:
          type: boolean
          default: true
        roles:
          type: array
          items:
            "$ref": "#/components/schemas/Role"
        grantedAuthorities:
          type: array
          items:
            "$ref": "#/components/schemas/Authority"
        userPreferences:
          type: array
          items:
            "$ref": "#/components/schemas/UserPreference"
    Authority:
      type: object
      x-thorapi-table-name: graymatter_authority
      description: Generated authority assigned to a Principal.
      required:
      - authority
      properties:
        principalId:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 60
        authority:
          type: string
          minLength: 1
          maxLength: 80
    Role:
      type: object
      x-thorapi-table-name: graymatter_role
      description: Generated RBAC role definition.
      required:
      - roleName
      properties:
        principalId:
          type: string
          format: uuid
        roleName:
          type: string
          enum:
          - EVERYONE
          - STAFF
          - ADMIN
          default: EVERYONE
    GrayMatter:
      type: object
      x-thorapi-table-name: graymatter
      description: Persistent aggregate for a local GrayMatter memory workspace.
      required:
      - name
      - description
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          x-thorapi-dataField: unique=true
        description:
          type: string
          maxLength: 4000
        recommendations:
          type: string
          maxLength: 4000
        alerts:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 500
    MemoryAssociation:
      type: object
      x-thorapi-table-name: memory_association
      x-graymatter-server-managed: true
      x-graymatter-association-delete-rule: CASCADE
      x-java-class-annotation: |
        @Table(name = "memory_association",
          uniqueConstraints = {
